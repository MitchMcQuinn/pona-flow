    <path d="M678 86 Q 560 160 438 198" stroke-dasharray="3 5" opacity="0.55" />
    <path d="M72 228 Q 180 250 358 220" />
    <path d="M148 348 Q 260 300 378 248" opacity="0.75" />
    <path d="M148 348 Q 430 410 708 292" stroke="#9a3412" stroke-width="0.9" opacity="0.55" />
    <path d="M708 292 Q 590 250 442 228" />
    <path d="M622 402 Q 500 340 430 250" opacity="0.6" />
    <path d="M248 58 Q 300 140 378 198" stroke-dasharray="2 6" opacity="0.4" />
    <path d="M528 96 Q 490 170 430 198" opacity="0.35" />
    <path d="M198 404 Q 310 360 148 348" opacity="0.4" />
    <path d="M72 228 Q 90 140 118 92" opacity="0.35" />
    <path d="M708 292 Q 740 180 678 86" opacity="0.3" />
  </g>

  <g fill="#1c1915">
