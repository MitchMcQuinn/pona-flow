    <circle cx="560" cy="320" r="1.8" opacity="0.4" />
  </g>

  <g font-family="Georgia, 'Iowan Old Style', Palatino, serif" font-size="13" fill="#1c1915">
    <g transform="translate(118 92)">
      <circle r="5.5" fill="#f4efe6" stroke="#1c1915" stroke-width="1.2" />
