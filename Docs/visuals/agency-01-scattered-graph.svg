<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="scattered-title scattered-desc">
  <title id="scattered-title">The context is scattered</title>
  <desc id="scattered-desc">A messy graph of loosely connected nodes around a person's head: client list, thread, brand doc, files, project tool.</desc>
  <g fill="none" stroke="#1c1915" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">
