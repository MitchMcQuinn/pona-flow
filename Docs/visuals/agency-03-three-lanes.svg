      <rect width="152" height="40" rx="6" fill="#fffdf8" stroke="#1c1915" stroke-width="1.4" />
      <text x="76" y="25" text-anchor="middle">Read this account</text>
    </g>
    <g transform="translate(336 292)">
      <rect width="152" height="40" rx="6" fill="#fffdf8" stroke="#1c1915" stroke-width="1.4" />
      <text x="76" y="25" text-anchor="middle">Follow this brand rule</text>
    </g>
    <g transform="translate(520 292)">
      <rect width="152" height="40" rx="6" fill="#fffdf8" stroke="#1c1915" stroke-width="1.4" />
      <text x="76" y="25" text-anchor="middle">Ask this approver</text>
    </g>
    <g transform="translate(704 292)">
      <rect width="152" height="40" rx="6" fill="#fffdf8" stroke="#9a3412" stroke-width="1.6" />
