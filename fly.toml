# pona flow on Fly.io — template for the Self-hosted edition.
# The cloud setup wizard (https://mitchmcquinn.github.io/pona-flow/wizard.html)
# rewrites app / region / PONA_FLOW_PUBLIC_URL for you. Manual path: Docs/SELF-HOSTING.md
#
#   fly apps create <your-app>
#   fly volumes create pona_data --region <region> --size 1
#   fly secrets set NEO4J_URI=... NEO4J_USER=neo4j NEO4J_PASSWORD=...
#   fly deploy

app = "pona-flow"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PONA_FLOW_HOST = "0.0.0.0"
  PONA_FLOW_PORT = "8765"
  PONA_FLOW_DATA_DIR = "/data"
  # Relative to PONA_FLOW_DATA_DIR — catalog + default space SQLite (entities / SCHEMA UI).
  SQLITE_DATABASE_PATH = "data.db"
  PONA_FLOW_AUTH_MODE = "local"
  PONA_FLOW_ALLOW_OPEN_SIGNUP = "0"
  PONA_FLOW_SIGNUP_CAN_CREATE_SPACES = "0"
  PONA_FLOW_CREDENTIAL_BACKEND = "local"
  PONA_FLOW_PUBLIC_URL = "https://pona-flow.fly.dev"
  FORWARDED_ALLOW_IPS = "*"

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[mounts]
  source = "pona_data"
  destination = "/data"
  initial_size = "1gb"
