# pona flow — public demo on Fly.io (Neo4j via Aura Free).
#
# One-time (see Docs/DEMO-HOSTING.md):
#   fly apps create pona-flow
#   fly volumes create pona_data --region iad --size 1
#   fly secrets set NEO4J_URI=... NEO4J_USER=neo4j NEO4J_PASSWORD=...
#   fly deploy
#   curl -X POST https://pona-flow.fly.dev/api/auth/setup ...  # create the operator admin
#
# App name / URL: https://pona-flow.fly.dev

app = "pona-flow"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PONA_FLOW_HOST = "0.0.0.0"
  PONA_FLOW_PORT = "8765"
  PONA_FLOW_DATA_DIR = "/data"
  PONA_FLOW_AUTH_MODE = "local"
  PONA_FLOW_ALLOW_OPEN_SIGNUP = "1"
  PONA_FLOW_SIGNUP_CAN_CREATE_SPACES = "1"
  PONA_FLOW_CREDENTIAL_BACKEND = "local"
  PONA_FLOW_PUBLIC_URL = "https://pona-flow.fly.dev"
  FORWARDED_ALLOW_IPS = "*"

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[mounts]
  source = "pona_data"
  destination = "/data"
  initial_size = "1gb"
