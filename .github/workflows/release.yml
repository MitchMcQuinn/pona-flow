name: Release

# Tag a commit `vX.Y.Z` and push the tag:
#   git tag v0.1.0 && git push origin v0.1.0
# This publishes ghcr.io/<owner>/pona-flow:{X.Y.Z, X.Y, latest} and creates a GitHub
# release with the compose bundle attached so a self-hoster never needs to clone.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    name: Build + push image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pona-flow
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PONA_FLOW_BUILD_SHA=${{ github.sha }}
            PONA_FLOW_GITHUB_REPO=${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4

      - name: Bundle self-hosting files
        run: |
          set -euo pipefail
          mkdir -p dist/pona-flow-selfhost/deploy
          cp docker-compose.yml .env.docker.example dist/pona-flow-selfhost/
          cp deploy/Caddyfile dist/pona-flow-selfhost/deploy/
          cp Docs/SELF-HOSTING.md dist/pona-flow-selfhost/README.md
          (cd dist && tar czf pona-flow-selfhost.tar.gz pona-flow-selfhost)

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/pona-flow-selfhost.tar.gz
            docker-compose.yml
            .env.docker.example
          body: |
            ## Self-host in two commands

            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/pona-flow-selfhost.tar.gz | tar xz
            cd pona-flow-selfhost && cp .env.docker.example .env && docker compose up -d
            ```

            Then open http://localhost:8765 and create the first admin account.
            Image: `ghcr.io/${{ github.repository_owner }}/pona-flow:${{ needs.image.outputs.version }}`
